[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogen-rl"
version = "0.1.0"
description = "Reinforcement learning for hydrogen storage in a wind energy system"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0,<2",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "rich>=13",
    "scikit-learn>=1.3",
    "stable-baselines3>=2.3,<3",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
